; How to Spearfish — engine configuration
; The project boots into /Engine/Maps/Entry and builds the vertical-slice region at runtime
; (see Docs/ARCHITECTURE.md, "Asset-free bootstrap"). Authored maps can replace this later.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
TransitionMap=
bUseSplitscreen=False
GlobalDefaultGameMode=/Script/HowToSpearfish.SpearfishMenuGameMode
GlobalDefaultServerGameMode=/Script/HowToSpearfish.SpearfishGameMode
GameInstanceClass=/Script/HowToSpearfish.SpearfishGameInstance
+GameModeClassAliases=(Name="Spearfish",GameMode="/Script/HowToSpearfish.SpearfishGameMode")
+GameModeClassAliases=(Name="Menu",GameMode="/Script/HowToSpearfish.SpearfishMenuGameMode")

[/Script/Engine.Engine]
NearClipPlane=5.000000

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.SkyAtmosphere=1
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.CustomDepth=3
r.AntiAliasingMethod=4
r.Nanite.ProjectEnabled=True
r.SkinCache.CompileShaders=True
r.Substrate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6

; --- Collision channels -------------------------------------------------------
; ECC_GameTraceChannel1 = Harpoon  (speargun shots / line wrapping)
; ECC_GameTraceChannel2 = Interact (focus traces for interaction prompts)
[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Harpoon")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Interact")

; --- Networking: listen-server co-op for 2 players ---------------------------
[OnlineSubsystem]
DefaultPlatformService=Null
bHasVoiceEnabled=true

[OnlineSubsystemNull]
bEnabled=true

[Voice]
bEnabled=true

[/Script/Engine.GameEngine]
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="OnlineSubsystemUtils.IpNetDriver")

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetServerMaxTickRate=60
MaxNetTickRate=120
MaxClientRate=100000
MaxInternetClientRate=100000
ConnectionTimeout=30.0
InitialConnectTimeout=30.0

[/Script/Engine.Player]
ConfiguredInternetSpeed=100000
ConfiguredLanSpeed=100000

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=False
